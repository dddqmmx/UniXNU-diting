name: diting porting record
on: [push, pull_request]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 519d80242a5028ee123447b01bc3b809baed565f
          path: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the device inputs the record is checked against
        # Install this repository's OS profiles (default ios-27.2.1-24B156 and legacy
        # ipados-18.7.10-22H374) and component entries before checking porting.toml.
        run: python3 device/scripts/install-unixnu-inputs.py --unixnu tools
      - name: Check porting record
        run: python3 tools/scripts/porting-record.py check --device device
