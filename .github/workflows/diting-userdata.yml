name: diting userdata

# OS-window rebuild for the prepared 22H374 userland. The full chain (prepared OS +
# SystemOS + Data) is the one run 42073458178 proved on a hosted macos-15-intel
# runner; this workflow uploads only the OS window and the reports, because the
# device keeps its SystemOS and Data windows for the first /diting boot.

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "IPSW URL (default: board.toml ipados-18.7.10-22H374 override [ipsw] url)"
        required: false
        type: string
      gpu_runtime:
        description: "Install the complete optimized A730/22H374 Metal runtime"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: diting-userdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  userland:
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: false
      - name: reclaim disk
        # Peak is about 37 GiB; the unused Xcode copies go below 80 GiB free.
        run: |
          set -euo pipefail
          selected="$(xcode-select -p)"
          echo "xcode-select: ${selected}"
          need=$((80 * 1024 * 1024))
          avail="$(df -k / | awk 'NR==2 {print $4}')"
          echo "avail_kb=${avail} need_kb=${need}"
          if [ "$avail" -lt "$need" ]; then
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              case "$selected" in
                "$app"/*) echo "keep $app" ;;
                *) echo "remove $app"; sudo rm -rf "$app" ;;
              esac
            done
          fi
          sudo rm -rf /Library/Developer/CoreSimulator/Caches /Library/Developer/CoreSimulator/Devices || true
          rm -rf "$HOME/Library/Developer/CoreSimulator" "$HOME/Library/Developer/Xcode/DerivedData" || true
          df -h
      - name: tools
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          python3 -m pip install --quiet --break-system-packages pyhpke
          ok=1
          for t in hdiutil diskutil aea python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          sudo -n true || { echo 'this runner cannot sudo -n, and the userland chain needs it'; ok=0; }
          [ "$ok" = 1 ]
      - uses: dtolnay/rust-toolchain@master
        if: inputs.gpu_runtime
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-ios
      - name: complete native GPU runtime
        if: inputs.gpu_runtime
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install bison flex llvm@18 ninja
          gpu_work="$RUNNER_TEMP/diting-gpu-sources"
          mkdir -p "$gpu_work"
          python3 -m venv "$gpu_work/venv"
          "$gpu_work/venv/bin/pip" install meson mako pyyaml ply packaging
          fetch_gpu_source() {
            local destination="$1" remote="$2" revision="$3"
            mkdir -p "$destination"
            git -C "$destination" init -q
            for attempt in 1 2 3; do
              if git -C "$destination" fetch --depth=1 "$remote" "$revision"; then
                return 0
              fi
              [ "$attempt" -lt 3 ] || return 1
              sleep 10
            done
          }
          fetch_gpu_source "$gpu_work/mesa-repository" https://gitlab.freedesktop.org/mesa/mesa.git 85fda3b36405bcaea8bffc64aa4f2651dc90770d
          fetch_gpu_source "$gpu_work/metal-repository" https://github.com/steelbrain/metal2vulkan.git 624bab3918de5b978e1101517abca2b4fa426565
          python3 device/scripts/prepare-diting-mesa.py --repository "$gpu_work/mesa-repository" --out "$gpu_work/mesa"
          python3 device/scripts/prepare-diting-metal-parity.py --repository "$gpu_work/metal-repository" --out "$gpu_work/metal"
          gpu_bison_bin="$(brew --prefix bison)/bin"
          export PATH="$gpu_bison_bin:$(brew --prefix flex)/bin:$PATH"
          export DITING_LLVM_AS="$(brew --prefix llvm@18)/bin/llvm-as"
          python3 device/scripts/build-diting-gpu-runtime.py \
            --mesa "$gpu_work/mesa" --translator "$gpu_work/metal" \
            --tools-directory "$gpu_bison_bin" --venv "$gpu_work/venv" \
            --output-dir "$RUNNER_TEMP/diting-gpu-runtime"
      - name: prepared userland
        id: userland
        run: |
          set -euo pipefail
          url="${{ inputs.ipsw_url }}"
          if [ -z "$url" ]; then
            url="$(python3 -c "import tomllib; b=tomllib.load(open('device/board.toml','rb')); print(b.get('os_overrides',{}).get('ipados-18.7.10-22H374',{}).get('ipsw',{}).get('url') or b['ipsw']['url'])")"
          fi
          case "$url" in
            https://*) ;;
            *) echo "ipsw_url must be an https URL, got: ${url}" >&2; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/diting-userland" "$RUNNER_TEMP/diting-ipsw-work"
          gpu_args=()
          if [ "${{ inputs.gpu_runtime }}" = true ]; then
            gpu_args=(--metal-runtime "$RUNNER_TEMP/diting-gpu-runtime/plugin")
          fi
          python3 device/scripts/prepare-diting-userland-from-ipsw.py \
            --ipsw-url "$url" \
            --work-dir "$RUNNER_TEMP/diting-ipsw-work" \
            --out "$RUNNER_TEMP/diting-userland" \
            --developer "$(xcode-select -p)" \
            --json-out "$RUNNER_TEMP/diting-userland/report.json" \
            --volume-layout-out "$RUNNER_TEMP/diting-userland/volume-layout.json" \
            --data-mib 8192 \
            "${gpu_args[@]}" \
            --jobs 4
          df -h
      - name: SHNGROOT directory
        timeout-minutes: 120
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/diting-ipsw-work" "$RUNNER_TEMP/diting-ufs"
          mkdir -p "$RUNNER_TEMP/diting-ufs"
          python3 device/scripts/prepare-ipados18-ufs-layout.py \
            --userland "$RUNNER_TEMP/diting-userland" \
            --systemos "$RUNNER_TEMP/diting-userland/diting-ipados18-systemos.cdr" \
            --volume-layout "$RUNNER_TEMP/diting-userland/volume-layout.json" \
            --output-dir "$RUNNER_TEMP/diting-ufs"
          python3 - "$RUNNER_TEMP/diting-ufs" <<'PY'
          import json, sys
          from pathlib import Path
          ufs = Path(sys.argv[1])
          header = (ufs / 'shngroot-ipados18.bin').read_bytes()
          layout = json.loads((ufs / 'ufs-layout.json').read_text())
          names = [w['name'] for w in layout['windows']]
          if header[:8] != b'SHNGROOT' or len(header) != 4096:
              raise SystemExit('the SHNGROOT header is not a 4096-byte directory')
          if names != ['OS', 'SystemOS', 'Data']:
              raise SystemExit('layout windows are %s, not OS/SystemOS/Data' % names)
          print('SHNGROOT directory', len(header), 'bytes for', ', '.join(names))
          PY
          df -h
      - name: userdata image
        timeout-minutes: 150
        run: |
          set -euo pipefail
          python3 device/scripts/build-diting-userdata-image.py \
            --layout "$RUNNER_TEMP/diting-ufs/ufs-layout.json" \
            --header "$RUNNER_TEMP/diting-ufs/shngroot-ipados18.bin" \
            --output "$RUNNER_TEMP/diting-ufs/diting-ipados18-userdata.img" \
            --max-parts 4 \
            --part-max-mib 8192 \
            --delete-sources \
            --delete-root "$RUNNER_TEMP/diting-userland" \
            --json-out "$RUNNER_TEMP/diting-ufs/userdata-image.json"
          ls -lh "$RUNNER_TEMP/diting-ufs"
          df -h
      - uses: actions/upload-artifact@v4
        with:
          name: diting-userdata-meta
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/diting-userland/report.json
            ${{ runner.temp }}/diting-userland/volume-layout.json
            ${{ runner.temp }}/diting-userland/apply-complete.json
            ${{ runner.temp }}/diting-ufs/ufs-layout.json
            ${{ runner.temp }}/diting-ufs/shngroot-ipados18.bin
            ${{ runner.temp }}/diting-ufs/userdata-image.json
      - uses: actions/upload-artifact@v4
        with:
          name: diting-userdata-part00
          retention-days: 3
          if-no-files-found: error
          path: ${{ runner.temp }}/diting-ufs/diting-ipados18-userdata.img.part00
      - uses: actions/upload-artifact@v4
        with:
          name: diting-userdata-part01
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/diting-ufs/diting-ipados18-userdata.img.part01
      - uses: actions/upload-artifact@v4
        with:
          name: diting-userdata-part02
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/diting-ufs/diting-ipados18-userdata.img.part02
      - uses: actions/upload-artifact@v4
        with:
          name: diting-userdata-part03
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/diting-ufs/diting-ipados18-userdata.img.part03
