]
evidence = [
  { kind = "host", reference = "tests/test_diting_ios27.py", command = "python3 -m unittest discover -s tests -p test_diting_ios27.py -v && python3 -m unittest discover -s tests -p test_diting_dtb.py -v", revision = "44d25d4cbb2bafd093f2a71eb9d1d05f8c40bd65", result = "12/12 iOS 27 identity/strict-prelink/override checks and 2/2 hardware DTB tests PASS; default board.toml resolves ios-27.2.1-24B156 and --os ipados-18.7.10-22H374 resolves legacy Darwin 24." },
  { kind = "source", reference = "migration/ios27/README.zh.md", result = "Documents exact 24B156 restore selection, arm64e source baseline, isolated build entry points and hardware bring-up record." },
]

