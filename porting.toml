]
inputs = [
  "Mu-Silicium UEFI firmware (Platforms/Xiaomi/ditingPkg) built as SILICIUM_UEFI.fd with 112-byte BootShim and Android boot v4 packaging.",
  "Upstream DarwinBoot (commit 3c75734014cdab0acd9541e88057b7606ee7ae08) plus patches/components-ios27/darwinboot-replace-in-ram.patch.",
  "DitingBootMemoryDxe PONGFAT1 initrd envelope (128 MiB scan limit; 112 MiB FAT payload used for iOS 27.2.1).",
]
configuration = [
  "board.toml [firmware] selects Platforms/Xiaomi/ditingPkg/diting.dsc with DITING_INITRD_DISK_ENABLED=1 and scripts/build-diting-hardware-dtb.py preflight.",
  "board.toml [payload] sets dram_size = 0x200000000, size_mib = 112, title = \"Diting iOS 27.2.1\" and [payload.adt] owned_memory_size = \"0x100000000\", chip_id = \"0x8150\".",
  "EFI/UniXNU/unixnu.toml loads DarwinBoot.efi and boots kernel.macho with kernel.macho.adt, kernel.macho.trustcache and kernel.macho.gpuaddon.",
]
procedure = [
  "Build DarwinBoot.efi for iOS 27 with scripts/build-diting-ios27-loader.py and check it with scripts/check-diting-ios27-loader.py.",
  "Pack the 112 MiB FAT volume into a PONGFAT1 ramdisk and Android boot v4 image with scripts/build-diting-ios27-bootimg.py.",
  "Test via fastboot boot <image> or convert with img2simg <raw> <sparse> 4096 and flash boot_b for persistent cold boot.",
]
findings = [
  "DitingBootMemoryDxe validates the 4096-byte PONGFAT1 header and accepts up to 128 MiB; 112 MiB fits the ~94 MiB 24B156 fileset kernel, DarwinBoot.efi, ADT, trustcache bundle and GPU addon.",
  "darwinboot-replace-in-ram.patch lets DarwinBoot place the arm64e MH_FILESET kernel cleanly within the owned 4 GiB bootstrap window on Diting's discontiguous DRAM layout.",
  "Firmware passes the 1220x2712 GOP framebuffer at 0xb8000000 and PSCI over SMC without modifying Android boot_a.",
]
completion = [
  "Cold boot from boot_b enters UniXNU UEFI, loads DarwinBoot.efi, validates the 112 MiB PONGFAT1 volume and hands off the 24B156 fileset kernel and ADT to XNU.",
]
limits = [
  "Mu-Silicium UEFI checkout is external; the device repository carries ditingPkg, patches and FDT inputs.",
  "Active persistent slot testing targets boot_b; stock Android boot_a is kept untouched.",
]
next_action = [
  "Keep the verified 112 MiB PONGFAT1 v4 image layout and update boot_b only after full regression checks.",
]
evidence = [
  { kind = "device", reference = "migration/ios27/README.zh.md", command = "fastboot -s 1d4eb066 -S 32M flash boot_b boot-ios27-gpu-btnbl120-3-112/diting-ios27-boot.sparse.img && fastboot -s 1d4eb066 reboot", revision = "44d25d4cbb2bafd093f2a71eb9d1d05f8c40bd65", result = "Repeated pure cold boots on device 1d4eb066 from boot_b hand off 94,076,928-byte 24B156 kernel.macho to iOS 27.2.1 userspace with zero loader errors." },
]

[[area]]
