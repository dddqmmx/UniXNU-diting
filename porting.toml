  "scripts/prepare-cpu-diagnostic.py",
]
inputs = [
  "SM8475 Kryo 8-core topology: cpu0-3 Cortex-A510 (E, MPIDR 0x000..0x300), cpu4-6 Cortex-A710 (P, 0x400..0x600), cpu7 Cortex-X2 (P, 0x700).",
  "GICv3 distributor at 0x17100000 (0x10000), redistributor at 0x17180000 (0x200000, stride 0x40000); 19.2 MHz ARM generic timer; PSCI 1.0 over SMC.",
  "Upstream ArmCpu (5f3702697ed80fd2e98594de1af7e32b4b77b08b) and ArmDTPlatform (417ff95d6a6e8607ddea9309ec45c3bfd4a67c60).",
]
configuration = [
  "configs/diting_ios27_defconfig enables CONFIG_XNU_ARM_DT_PLATFORM=y, CONFIG_XNU_ARMCPU=y, CONFIG_XNU_NATIVE_ARCH_TIMER=y, CONFIG_XNU_NATIVE_PAN=y.",
  "board.toml [payload] kernel_args sets cpus=8, smp=1, armcpu-self-ipi=1, armcpu-edge=1, use_contiguous_hint=0.",
  "patches/xnu-ios27/ adds secondary-affinity, secondary-cpu-bringup, no-cntp-ctl, no-iortc-wait, arm64e IOWorkLoop active-eventsource fix, and CPU idle/EPSS hooks.",
]
procedure = [
  "Compile ArmDTPlatform and ArmCpu through [kernel] archives and link them into the arm64e XNU 12377 kernel.",
  "Boot with cpus=8 smp=1 armcpu-self-ipi=1 and verify all 7 secondary cores come online and handle IPIs and interrupts without panics.",
]
findings = [
  "Secondary arm64e CPU bring-up on SM8475 requires PoC cache cleaning of ResetHandlerData, CpuDataEntries, cpu_data_ptr, cpu_ttep, native_pac_keys and reachable L1/L2/L3 page tables before PSCI CPU_ON, keeping LowExceptionVectorBase until TPIDR_EL1 is set, and issuing isb sy after CPACR_EL1 and VBAR_EL1 updates.",
  "armcpu-self-ipi=1 restores cpu_signal() inter-processor interrupts across all 8 cores; sm8475-no-iortc-wait.patch eliminates the 30 s bsd_init() IORTC wait.",
  "With arm64e -fptrauth-function-pointer-type-discrimination, OSMetaClassBase::_ptmf2ptf returns a shared _vfpthunk_ causing IOWorkLoop::eventSourcePerformsWork() to misclassify active IOInterruptEventSource instances as passive; ios27-ioworkloop-arm64e-active-eventsource.patch fixes this and unblocks ADSP/battery interrupt delivery.",
  "DitingCpuPolicy27.cpp and ios27-diting-cpu-idle.patch implement iOS 27 CPU idle and EPSS frequency governance.",
]
completion = [
  "All 8 SM8475 cores (CPU 0..7) come online cleanly with zero SMP failures and sustain full iOS 27.2.1 userspace.",
]
limits = [
  "Native PAC feature bits are present on all 8 cores, while full EL0/EL1 PAC key-access roundtrip qualification and measured EPSS frequency readbacks under load remain ongoing.",
  "Deep CPU cluster power-collapse / full system suspend-resume is not yet qualified.",
]
next_action = [
  "Validate iOS 27 CPU idle and EPSS power reductions on device alongside the charging/power governance build.",
]
evidence = [
  { kind = "device", reference = "migration/ios27/交接-2026-11-23-ios27-24B156-严格预链接清零与8核存储APFS实机验证.md", command = "fastboot -s 1d4eb066 boot boot-diag-31a/diting-ios27-boot.img", revision = "44d25d4cbb2bafd093f2a71eb9d1d05f8c40bd65", result = "Device 1d4eb066 verified all 7 secondary cores online (SMP_STATE: run=7 step=0,7,7,7,7,7,7,7 fail=0,0,0,0,0,0,0,0 rc=0) with zero panics; sustained across 261 iOS 27.2.1 processes on persistent boot_b." },
]

