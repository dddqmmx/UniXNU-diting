schema_version = 1

# Machine-checked porting record for Redmi K50 Ultra (diting / Qualcomm SM8475).
# Validated by: python3 <UniXNU>/scripts/porting-record.py check --device .
#
# Status vocabulary: planned, implemented, host-verified, device-verified, not-applicable.
# Default target is iOS 27.2.1 (24B156, arm64e); legacy iPadOS 18.7.10 (22H374, arm64)
# remains preserved under board.toml [os_overrides."ipados-18.7.10-22H374"].

[device]
name = "diting"
soc = "SM8475"
os_profile = "ios-27.2.1-24B156"
summary = "Redmi K50 Ultra (diting / Qualcomm SM8475) running UniXNU iOS 27.2.1 (24B156, arm64e, iPhone18,2 / V54AP) on an eight-core XNU 12377.121.6 source kernel with strict zero-stub 24B156 MH_FILESET prelinking: verified cold boot from persistent boot_b to the iOS 27 lockscreen and home screen with SM8475 UFS/APFS three-volume boot, 1220x2712 120 Hz display and DCS backlight, Adreno 730 Turnip/Metal GPU rendering, ST61Y SPI touch and SPMI hardware buttons, software IOAESAccelerator, ADSP/battery reporting, QCA6490 Wi-Fi hardware scan, and cold-boot USB console/fastboot recovery. Legacy iPadOS 18.7.10 (22H374, Darwin 24) remains selectable via --os ipados-18.7.10-22H374."

