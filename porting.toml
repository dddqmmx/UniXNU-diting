  "Public source baseline: UniXNU 519d80242a5028ee123447b01bc3b809baed565f, XNU 12377.121.6 (Darwin 25.5.0, commit ac9718fb1af618d5ce8678d0dc6e8a58f252216f), libplatform-375.120.2, libdispatch-1542.100.32, AvailabilityVersions-157.2, libpthread-539.100.4, IOStorageFamily-337.100.1, IOHIDFamily-2238.120.5.",
  "Legacy OS override: iPad7,11 (J171AP) iPadOS 18.7.10 (22H374) / Darwin 24.6.0 / XNU 11417.140.69.",
]
configuration = [
  "board.toml uses schema_version = 2 with soc_source = \"sm8475\" and default os_profile = \"ios-27.2.1-24B156\".",
  "Default [components] selects ArmDTPlatform, ArmCpu, XnuPrelink and DarwinBoot; [kernel] selects diting_ios27_defconfig, arch/os/device patch series and build-diting-ios27-drivers.py.",
  "feeds.toml pins only the shared sm8475 SoC seed so OS-specific Apple OSS [[source]] pins in os-profiles/*/profile.toml are never shadowed.",
  "Legacy iPadOS 18.7.10 (DitingPlatform24, diting_ipados18_defconfig, 22H374 restore, 96 MiB payload, chip_id 0x8010) is retained under [os_overrides.\"ipados-18.7.10-22H374\"] with remove = [\"ipsw.variant\", \"kernel.prelink.early_security_init\", \"kernel.prelink.extra_args\"].",
]
procedure = [
  "Install repository OS profiles and component definitions into the pinned UniXNU checkout with python3 scripts/install-unixnu-inputs.py --unixnu <UniXNU>.",
  "Prepare the isolated iOS 27.2.1 tree with python3 scripts/build-diting-ios27.py --unixnu <UniXNU> --out <build-dir> --stage prepare --jobs 8.",
  "Validate the board configuration and porting record with python3 -m unittest discover -s tests -p test_diting_ios27.py -v and python3 <UniXNU>/scripts/porting-record.py check --device .",
]
findings = [
  "Default target switched from ipados-18.7.10-22H374 to ios-27.2.1-24B156 in board.toml, feeds.toml, unixnu.lock and porting.toml while keeping --os ipados-18.7.10-22H374 resolvable.",
  "24B156 ships both Recovery Customer Install and Customer Erase Install (IPSW) Erase BuildIdentities; diting_ios27.restore_identity() and [ipsw] variant enforce exact Customer Erase Install selection.",
  "Because Apple has not published xnu-13432.42.3 source, the port builds xnu-12377.121.6 with arm64e compatibility patches and tracks restore kernel and source kernel versions separately.",
]
completion = [
  "UniXNU resolves the four format 2 layers (arm64e, sm8475, ios-27.2.1-24B156, diting) without --os and resolves ipados-18.7.10-22H374 cleanly when --os ipados-18.7.10-22H374 is supplied.",
  "Host identity, DTB and porting-record checks pass with zero errors.",
]
limits = [
  "Apple IPSW members, private device firmware and local build trees stay outside Git.",
  "tests/test_diting_platform_identity.py C++ subtest expects drivers/ArmDTPlatform/DitingPlatformIdentity.h which is absent from the current vendored ArmDTPlatform tree.",
]
next_action = [
